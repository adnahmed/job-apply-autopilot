  start_date: "30 days after offer unless negotiable is available."
  notice_period: "30 days when mandatory; otherwise choose negotiable if available."
  years_total_experience: "derive-from-canonical-employment-history"
  work_authorization: "Never infer. Answer only from verified facts or the exact application context."
  factual_unknown_required: "Use verified data; choose N/A/prefer-not-to-answer when available; otherwise skip."
