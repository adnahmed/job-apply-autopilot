    - "immigration support"
    - "relocation assistance"
    - "relocation package"
    - "global mobility"
    - "international candidates welcome"
    - "work permit support"
    - "visa transfer"
    - "relocation bonus"

answer_policy:
  cover_letter: "Generate concise job-specific prose using only verified canonical facts and current verified job facts."
  demographic_optional: "Prefer not to answer / decline to self-identify."
  disability_optional: "Prefer not to answer / decline to self-identify."
  veteran_optional: "Prefer not to answer / decline to self-identify."
  gender_optional: "Prefer not to answer / decline to self-identify."
  race_ethnicity_optional: "Prefer not to answer / decline to self-identify."
  compensation_text: "Negotiable; open to a market-competitive package."
  compensation_numeric_strategy: "employer-acceptance-lower-quartile"
  posted_range_fraction: 0.25
  pakistan_local_unlabeled_numeric: 350000
  pakistan_local_currency: "PKR"
  pakistan_local_period: "month"
  global_remote_yearly_numeric: 60000
  global_remote_monthly_numeric: 5000
  global_remote_hourly_numeric: 30
  global_remote_currency: "USD"
  start_date: "30 days after offer unless negotiable is available."
  notice_period: "30 days when mandatory; otherwise choose negotiable if available."
  years_total_experience: "derive-from-canonical-employment-history"
  work_authorization: "Never infer. Answer only from verified facts or the exact application context."
  factual_unknown_required: "Resolve routine fields deterministically; choose N/A/prefer-not-to-answer when available; use a dedicated protected-fact blocker only for identity, legal, authorization, or sensitive-disclosure facts."

job_quality:
  excluded_employers:
    - "micro1"
    - "Crossing Hurdles"
  excluded_domains:
