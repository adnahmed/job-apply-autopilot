fast_path:
  enabled: true
  no_todowrite_for_routine_campaign: true
  no_auto_reopen_historical_skips: true
  fast_and_slow_workers_separate_waves: true
  obvious_skip_without_workitem: true
  rejection_artifacts_minimal: true
