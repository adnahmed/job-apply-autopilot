  public_evidence_max_repos_per_job: 5
  public_evidence_max_deployments_per_job: 2
  public_evidence_no_full_repo_inventory: true
  eligibility_max_authoritative_sources: 2
  analytics_refresh_after_meaningful_batch: true

resume_generation:
  source_policy: "immutable-canonical-per-job"
  ai_canonical: "canonical/ai-applied-canonical.tex"
  backend_canonical: "canonical/backend-platform-canonical.tex"
  canonical_fact_index: "canonical/canonical-facts.yaml"
  always_generate_per_job: true
  always_start_from_canonical: true
  preserve_canonical_audit_copy: true
  require_fit_map_before_tailoring: true
  require_tailoring_audit: true
  stale_pdf_fallback_allowed: false
  compile_script: "scripts/compile-resume.ps1"
  tailoring_style: "selection-first-conservative"

autonomy:
  ask_user_questions: false
  submit_without_preview: true
  continue_after_skipped_application: true
  requested_count_is_maximum_not_quota: true
  external_applications_unlimited: true
  external_application_concurrency_unlimited: true
  linkedin_easy_apply_governor_enabled: true
  linkedin_easy_apply_max_successful_per_hour: 4
  linkedin_easy_apply_max_successful_rolling_24h: 20
  linkedin_easy_apply_min_seconds_between_submissions: 600
  minimum_match_score: 72
  prefer_recent_days: 7
  stop_domain_on_first_automation_signal: true
  stop_on_account_security_warning: true
  never_bypass_captcha_or_security_challenge: true
  captcha_external_solver_enabled: true
  captcha_solver_trigger_clicks: 1
  captcha_solver_wait_seconds: 120
  preserve_unresolved_captcha_tab: true
  captcha_circuit_after_failed_solver: true
  ordinary_form_validation_retries: 1
  anti_bot_submission_retries: 0

authentication:
  prefer_existing_session: true
  prefer_linkedin_oauth: true
  prefer_linkedin_profile_import: true
  password_account_creation_allowed: true
  password_generation_allowed: true
  password_autofill_allowed: true
  auth_priority:
    - "existing-session"
    - "linkedin-oauth"
    - "linkedin-profile-import"
    - "other-already-authenticated-oauth"
    - "password-account"

